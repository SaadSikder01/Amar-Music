<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Amar Music</title>
<link rel="manifest" id="manifestLink">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a; --panel: #121212; --panel-2: #181818; --hover: #1f1f1f;
    --accent: #1db954; --text: #ffffff; --text-dim: #a7a7a7; --border: #282828;
    --yt: #ff0000;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; height: 100dvh; overflow: hidden;
    display: grid; grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr 88px;
    grid-template-areas: "sidebar main" "player player";
  }
  .sidebar {
    grid-area: sidebar; background: var(--panel);
    padding: 1.5rem 1rem; overflow-y: auto;
    display: flex; flex-direction: column; gap: 0.5rem;
    padding-top: max(1.5rem, env(safe-area-inset-top));
  }
  .logo { display: flex; align-items: center; gap: 0.6rem; font-size: 1.4rem; font-weight: 700; padding: 0 0.5rem 1.5rem; }
  .logo .dot { width: 28px; height: 28px; background: var(--accent); border-radius: 50%; display: grid; place-items: center; font-size: 1rem; }
  .nav-item {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.7rem 0.8rem; border-radius: 6px;
    color: var(--text-dim); cursor: pointer;
    font-size: 0.95rem; font-weight: 600;
    transition: all 0.15s; user-select: none;
  }
  .nav-item:hover, .nav-item.active { color: var(--text); background: var(--hover); }
  .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
  .sidebar hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0.5rem; }
  .sidebar-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 0 0.8rem 0.5rem; font-weight: 700; }

  .main {
    grid-area: main; overflow-y: auto;
    padding: 1.5rem 2rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    background: linear-gradient(180deg, #1a1a1a 0%, var(--bg) 300px);
    -webkit-overflow-scrolling: touch;
  }
  .main::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
  .topbar {
    display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;
    position: sticky; top: -1.5rem;
    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 1rem 0; margin-top: -1rem; z-index: 10;
  }
  .search-box { flex: 1; max-width: 400px; position: relative; }
  .search-box input {
    width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem;
    border-radius: 500px; border: 1px solid transparent;
    background: var(--panel-2); color: var(--text);
    font-size: 0.9rem; outline: none; transition: all 0.2s;
  }
  .search-box input:focus { border-color: var(--text); background: #242424; }
  .search-box svg { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-dim); }
  .section-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.2rem; }

  .track-list { display: flex; flex-direction: column; }
  .track-row {
    display: grid; grid-template-columns: 30px 44px 1fr 60px;
    gap: 1rem; align-items: center;
    padding: 0.6rem 0.8rem; border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
  }
  .track-row:hover { background: var(--hover); }
  .track-row.playing { background: #1a2e1f; }
  .track-row.playing .track-title { color: var(--accent); }
  .track-num { color: var(--text-dim); font-size: 0.9rem; text-align: center; position: relative; }
  .track-row .play-icon { display: none; }
  .track-row:hover .track-num span { display: none; }
  .track-row:hover .play-icon { display: block; margin: 0 auto; }
  .track-art { width: 44px; height: 44px; border-radius: 4px; background: #282828; object-fit: cover; display: block; }
  .track-info { min-width: 0; }
  .track-title { font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dur { color: var(--text-dim); font-size: 0.85rem; text-align: right; }
  .badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; font-weight: 700; }
  .badge.yt { background: var(--yt); color: #fff; }
  .badge.audius { background: var(--accent); color: #000; }
  .empty, .loading { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: 0.95rem; }

  .player {
    grid-area: player; background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: 1fr 2fr 1fr;
    align-items: center; padding: 0 1rem;
    padding-bottom: env(safe-area-inset-bottom); gap: 1rem;
  }
  .now-playing { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
  .np-art-slot {
    position: relative; width: 56px; height: 56px;
    border-radius: 4px; overflow: hidden;
    background: #282828 url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='56' height='56'%3E%3Ctext x='28' y='38' font-size='24' text-anchor='middle' fill='%23666'%3E%E2%99%AA%3C/text%3E%3C/svg%3E") center/cover no-repeat;
    flex-shrink: 0;
  }
  .np-art-slot img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  #ytWrap { position: absolute; inset: 0; display: none; z-index: 2; background: #000; }
  #ytWrap iframe { width: 100% !important; height: 100% !important; display: block; border: 0; }
  .now-playing .np-info { min-width: 0; }
  .now-playing .np-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-playing .np-artist { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-center { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .controls { display: flex; align-items: center; gap: 1rem; }
  .ctrl-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 0.4rem; display: grid; place-items: center; transition: color 0.15s; }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .play-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: #000; display: grid; place-items: center; cursor: pointer; border: none; transition: transform 0.15s; }
  .play-btn:hover { transform: scale(1.08); }
  .play-btn svg { width: 16px; height: 16px; }
  .progress-row { display: flex; align-items: center; gap: 0.7rem; width: 100%; max-width: 600px; }
  .time { font-size: 0.7rem; color: var(--text-dim); min-width: 35px; text-align: center; }
  .progress-bar, .volume-bar { flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; position: relative; overflow: hidden; }
  .progress-fill, .volume-fill { height: 100%; background: var(--text); width: 0%; border-radius: 2px; }
  .progress-bar:hover .progress-fill, .volume-bar:hover .volume-fill { background: var(--accent); }
  .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 0.8rem; }
  .volume-bar { width: 100px; flex: none; }
  .hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 0.4rem; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
  .overlay.show { display: block; }

  .bg-indicator {
    position: fixed; top: 12px; right: 12px;
    background: #0288d1; color: #fff;
    padding: 6px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 700;
    z-index: 200; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s;
  }
  .bg-indicator.show { display: flex; align-items: center; gap: 6px; }
  .bg-indicator.fg { background: #f57c00; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  body.mobile-ui {
    grid-template-columns: 1fr; grid-template-rows: 1fr auto;
    grid-template-areas: "main" "player";
  }
  body.mobile-ui .sidebar { position: fixed; top: 0; left: -260px; width: 240px; height: 100dvh; z-index: 100; transition: left 0.3s cubic-bezier(0.4,0,0.2,1); padding-top: max(1.5rem, env(safe-area-inset-top)); }
  body.mobile-ui .sidebar.open { left: 0; }
  body.mobile-ui .hamburger { display: block; }
  body.mobile-ui .main { padding: 1rem; padding-top: max(0.75rem, env(safe-area-inset-top)); }
  body.mobile-ui .topbar { top: -0.75rem; margin-top: -0.75rem; padding: 0.75rem 0; }
  body.mobile-ui .section-title { font-size: 1.3rem; }
  body.mobile-ui .track-row { grid-template-columns: 30px 44px 1fr 50px; gap: 0.75rem; padding: 0.5rem; }
  body.mobile-ui .track-art { width: 40px; height: 40px; }
  body.mobile-ui .player { grid-template-columns: 1fr auto; grid-template-rows: auto auto; grid-template-areas: "now controls" "progress progress"; padding: 0.6rem 0.75rem; padding-bottom: max(0.6rem, env(safe-area-inset-bottom)); gap: 0.5rem; }
  body.mobile-ui .now-playing { grid-area: now; }
  body.mobile-ui .np-art-slot { width: 44px; height: 44px; }
  body.mobile-ui .now-playing .np-title { font-size: 0.85rem; }
  body.mobile-ui .now-playing .np-artist { font-size: 0.7rem; }
  body.mobile-ui .player-center { grid-area: controls; display: block; }
  body.mobile-ui .controls { gap: 0.6rem; }
  body.mobile-ui .ctrl-btn svg { width: 22px; height: 22px; }
  body.mobile-ui .play-btn { width: 40px; height: 40px; }
  body.mobile-ui .player-right { display: none; }
  body.mobile-ui .progress-row { grid-area: progress; max-width: none; gap: 0.5rem; }
  body.mobile-ui .time { font-size: 0.65rem; min-width: 30px; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="bg-indicator" id="bgIndicator">
  <span id="bgIcon">🔊</span>
  <span id="bgText">ব্যাকগ্রাউন্ড মোড</span>
</div>

<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="dot">♪</div>Amar Music</div>
  <div class="nav-item active" onclick="loadTrending(); setActive(this)">

<audio id="audio" preload="auto" playsinline></audio>

<script>
/* ============================================================
   কনফিগ
============================================================ */
const APP_NAME = 'AmarMusicApp';
const AUDIUS_KEY = '2e086e9c9bd876da89c992a57effb89d196234e2';
const AUDIUS_API = 'https://discoveryprovider.audius.co/v1';
const YOUTUBE_KEY = 'AIzaSyBYMKWcyx0YYvLlJQj2MBKeWQBH-oqxYg4';
const HEADERS = { 'x-api-key': AUDIUS_KEY };

// 🔑 আপনার Cloudflare Worker প্রক্সি
const WORKER_URL = 'https://patient-heart-8300.sikdarabdulla02.workers.dev';

/* ============================================================
   স্টেট
============================================================ */
let queue = [];
let currentIndex = -1;
let isMuted = false;
let lastVolume = 0.8;
let ytPlayer = null;
let ytReady = false;
let ytScriptLoaded = false;
let currentPlayMode = 'idle'; // 'audius' | 'yt-audio' | 'yt-iframe' | 'idle'

const audio = document.getElementById('audio');
audio.volume = lastVolume;

/* ============================================================
   মোবাইল UI ডিটেকশন (Desktop site চালু থাকলেও কাজ করবে)
============================================================ */
function applyMobileUI() {
  const ua = navigator.userAgent || '';
  const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  const isTouchSmall = (navigator.maxTouchPoints > 1) && (Math.min(window.innerWidth, screen.width) < 1024);
  document.body.classList.toggle('mobile-ui', isMobileUA || isTouchSmall);
}
applyMobileUI();
window.addEventListener('resize', applyMobileUI);
window.addEventListener('orientationchange', applyMobileUI);

/* ============================================================
   Placeholder
============================================================ */
function placeholderArt() {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150">' +
    '<rect width="150" height="150" fill="#282828"/>' +
    '<text x="75" y="92" font-size="52" text-anchor="middle" fill="#666" font-family="sans-serif">♪</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const PLACEHOLDER = placeholderArt();

document.addEventListener('error', (e) => {
  const el = e.target;
  if (el && el.tagName === 'IMG' && el.dataset.fb !== '1') {
    el.dataset.fb = '1';
    el.src = PLACEHOLDER;
  }
}, true);

/* ============================================================
   PWA manifest
============================================================ */
const manifestData = {
  name: 'Amar Music', short_name: 'Amar Music', start_url: '.',
  display: 'standalone', background_color: '#0a0a0a', theme_color: '#1db954',
  orientation: 'portrait',
  icons: [{
    src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
      '<rect width="512" height="512" fill="#0a0a0a"/>' +
      '<circle cx="256" cy="256" r="180" fill="#1db954"/>' +
      '<text x="256" y="330" font-size="220" text-anchor="middle" fill="white" font-family="sans-serif">♪</text></svg>'
    ),
    sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
  }]
};
try {
  const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
} catch(e) {}

/* ============================================================
   Audius API
============================================================ */
async function audiusGet(path) {
  const url = `${AUDIUS_API}${path}${path.includes('?') ? '&' : '?'}app_name=${APP_NAME}`;
  const res = await fetch(url, { headers: HEADERS });
  if (!res.ok) throw new Error('Audius ' + res.status);
  return res.json();
}

async function searchAudius(q) {
  try {
    const data = await audiusGet(`/tracks/search?query=${encodeURIComponent(q)}&limit=15`);
    return (data.data || []).map(t => ({
      source: 'audius', id: t.id, title: t.title,
      artist: t.user ? t.user.name : 'অজানা শিল্পী',
      artwork: t.artwork ? (t.artwork['480x480'] || t.artwork['150x150']) : PLACEHOLDER,
      thumb: t.artwork ? t.artwork['150x150'] : PLACEHOLDER,
      duration: t.duration || 0
    }));
  } catch (e) { return []; }
}

/* ============================================================
   YouTube Search (Google API)
============================================================ */
async function searchYouTube(q) {
  try {
    const cacheKey = 'yt_' + q.toLowerCase();
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);

    const url = `https://www.googleapis.com/youtube/v3/search?` +
      `part=snippet&type=video&videoEmbeddable=true&maxResults=15` +
      `&q=${encodeURIComponent(q + ' song')}&key=${YOUTUBE_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('YT ' + res.status);
    const data = await res.json();
    const items = (data.items || []).map(item => ({
      source: 'youtube', id: item.id.videoId,
      title: item.snippet.title,
      artist: item.snippet.channelTitle,
      artwork: item.snippet.thumbnails.medium.url,
      thumb: item.snippet.thumbnails.default.url,
      duration: 0
    }));
    try { sessionStorage.setItem(cacheKey, JSON.stringify(items)); } catch(e) {}
    return items;
  } catch (e) { return []; }
}

/* ============================================================
   🔑 Cloudflare Worker প্রক্সি দিয়ে YouTube অডিও URL
   এটাই ব্যাকগ্রাউন্ড প্লেব্যাকের মূল চাবি
============================================================ */
async function getYouTubeAudioUrl(videoId) {
  const cacheKey = 'ytw_' + videoId;
  const cached = sessionStorage.getItem(cacheKey);
  if (cached) return cached;

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    const res = await fetch(`${WORKER_URL}/?id=${videoId}`, {
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    if (!res.ok) {
      console.log('[Worker] HTTP', res.status);
      return null;
    }

    const data = await res.json();
    if (data.url) {
      sessionStorage.setItem(cacheKey, data.url);
      console.log('[Worker] ✅ via', data.via);
      return data.url;
    }
    console.log('[Worker] ❌', data.error);
    return null;
  } catch (e) {
    console.warn('[Worker] fetch failed:', e.message);
    return null;
  }
}

/* ============================================================
   ট্রেন্ডিং / ফিচার্ড
============================================================ */
async function loadTrending() {
  setTitle('ট্রেন্ডিং গান');
  setContent('<div class="loading">লোড হচ্ছে...</div>');
  try {
    const data = await audiusGet('/tracks/trending?limit=30');
    const tracks = (data.data || []).map(t => ({
      source: 'audius', id: t.id, title: t.title,
      artist: t.user ? t.user.name : '',
      artwork: t.artwork ? (t.artwork['480x480'] || t.artwork['150x150']) : PLACEHOLDER,
      thumb: t.artwork ? t.artwork['150x150'] : PLACEHOLDER,
      duration: t.duration || 0
    }));
    renderTracks(tracks);
  } catch (e) { setContent('<div class="empty">গান লোড করা যায়নি।</div>'); }
}

async function loadFeatured() {
  setTitle('ফিচার্ড প্লেলিস্ট');
  setContent('<div class="loading">লোড হচ্ছে...</div>');
  try {
    const data = await audiusGet('/playlists/trending?limit=10');
    const tracks = [];
    (data.data || []).forEach(pl => (pl.tracks || []).slice(0,3).forEach(t => {
      tracks.push({
        source: 'audius', id: t.id, title: t.title,
        artist: t.user ? t.user.name : '',
        artwork: t.artwork ? (t.artwork['480x480'] || t.artwork['150x150']) : PLACEHOLDER,
        thumb: t.artwork ? t.artwork['150x150'] : PLACEHOLDER,
        duration: t.duration || 0
      });
    }));
    renderTracks(tracks.length ? tracks : []);
  } catch (e) { loadTrending(); }
}

/* ============================================================
   হাইব্রিড সার্চ
============================================================ */
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  setTitle(`"${q}" এর ফলাফল`);
  setContent('<div class="loading">অডিয়াসে খোঁজা হচ্ছে...</div>');

  const audiusResults = await searchAudius(q);
  if (audiusResults.length > 0) { renderTracks(audiusResults); return; }

  setContent('<div class="loading">YouTube-এ খোঁজা হচ্ছে...</div>');
  const ytResults = await searchYouTube(q);
  if (ytResults.length > 0) renderTracks(ytResults);
  else setContent('<div class="empty">কোনো গান পাওয়া যায়নি।</div>');
}

/* ============================================================
   রেন্ডার
============================================================ */
function setTitle(t) { document.getElementById('sectionTitle').textContent = t; }
function setContent(h) { document.getElementById('content').innerHTML = h; }

function renderTracks(tracks) {
  if (!tracks.length) { setContent('<div class="empty">কোনো গান পাওয়া যায়নি।</div>'); return; }
  queue = tracks;
  setContent(`<div class="track-list">` + tracks.map((t, i) => {
    const dur = t.duration ? fmtTime(t.duration) : '—';
    const badge = t.source === 'youtube'
      ? '<span class="badge yt">YT</span>'
      : '<span class="badge audius">A</span>';
    return `
      <div class="track-row" data-index="${i}" onclick="playAt(${i})">
        <div class="track-num">
          <span>${i + 1}</span>
          <svg class="play-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <img class="track-art" src="${t.thumb || PLACEHOLDER}" alt="" loading="lazy">
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}${badge}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
        </div>
        <div class="track-dur">${dur}</div>
      </div>`;
  }).join('') + '</div>');
  highlightCurrent();
}

function showQueue() {
  setTitle('প্লে-কিউ');
  if (!queue.length) { setContent('<div class="empty">কিউ খালি।</div>'); return; }
  renderTracks(queue);
}

/* ============================================================
   🎯 প্লেব্যাক
============================================================ */
async function playAt(index) {
  if (index < 0 || index >= queue.length) return;
  currentIndex = index;
  const t = queue[index];

  document.getElementById('npTitle').textContent = t.title;
  document.getElementById('npArtist').textContent = t.artist;

  // আগের প্লেয়ার বন্ধ
  try { audio.pause(); } catch(e) {}
  if (ytPlayer && ytReady) { try { ytPlayer.stopVideo(); } catch(e) {} }

  if (t.source === 'audius') {
    // ========== অডিয়াস ==========
    hideYT();
    const npArt = document.getElementById('npArt');
    npArt.dataset.fb = '';
    npArt.src = t.artwork || PLACEHOLDER;
    npArt.style.display = 'block';

    audio.src = `${AUDIUS_API}/tracks/${t.id}/stream?app_name=${APP_NAME}`;
    try { await audio.play(); } catch (e) { console.warn('Audius play failed:', e); }
    currentPlayMode = 'audius';
    updateMediaSession(t);
    showBgIndicator('background', 'ব্যাকগ্রাউন্ড চালু');
  } else {
    // ========== YouTube ==========
    document.getElementById('npTitle').textContent = t.title + ' ⏳';

    // Worker প্রক্সি দিয়ে অডিও URL আনি
    let audioUrl = null;
    try {
      audioUrl = await getYouTubeAudioUrl(t.id);
    } catch (e) {
      console.warn('Worker error:', e);
    }

    if (audioUrl) {
      // ✅ সরাসরি অডিও → ব্যাকগ্রাউন্ডে চলবে
      hideYT();
      const npArt = document.getElementById('npArt');
      npArt.dataset.fb = '';
      npArt.src = t.artwork || PLACEHOLDER;
      npArt.style.display = 'block';

      audio.src = audioUrl;
      try {
        await audio.play();
        currentPlayMode = 'yt-audio';
        updateMediaSession(t);
        showBgIndicator('background', 'ব্যাকগ্রাউন্ড চালু');
        document.getElementById('npTitle').textContent = t.title;
      } catch (e) {
        console.warn('Direct audio play failed:', e);
        await playYouTubeIframe(t);
      }
    } else {
      // ❌ অডিও URL পাওয়া যায়নি → IFrame ফলব্যাক
      console.log('[BG] Falling back to iframe');
      await playYouTubeIframe(t);
    }
    updateMediaSession(t);
  }
  highlightCurrent();
}

async function playYouTubeIframe(t) {
  document.getElementById('ytWrap').style.display = 'block';
  document.getElementById('npArt').style.display = 'none';
  await ensureYTAPI();

  if (!ytPlayer) {
    ytPlayer = new YT.Player('ytPlayer', {
      width: '100%', height: '100%',
      videoId: t.id,
      playerVars: { autoplay: 1, controls: 1, playsinline: 1, modestbranding: 1, rel: 0 },
      events: {
        onReady: e => {
          ytReady = true;
          try { e.target.setVolume(isMuted ? 0 : lastVolume * 100); } catch(x){}
          e.target.playVideo();
        },
        onStateChange: e => {
          if (e.data === 1) setPlayIcon(true);
          else if (e.data === 2) setPlayIcon(false);
          else if (e.data === 0) playNext();
        },
        onError: e => {
          console.warn('YT error:', e.data);
          hideYT();
          setTimeout(playNext, 500);
        }
      }
    });
  } else {
    try {
      ytPlayer.loadVideoById(t.id);
      ytPlayer.playVideo();
    } catch(e) { console.warn(e); }
  }
  currentPlayMode = 'yt-iframe';
  document.getElementById('npTitle').textContent = t.title;
  showBgIndicator('foreground', 'শুধু ফোরগ্রাউন্ড');
}

function hideYT() {
  document.getElementById('ytWrap').style.display = 'none';
  if (ytPlayer && ytReady) { try { ytPlayer.stopVideo(); } catch(e) {} }
}

function ensureYTAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (ytScriptLoaded) {
    return new Promise(resolve => {
      const t = setInterval(() => {
        if (window.YT && window.YT.Player) { clearInterval(t); resolve(); }
      }, 100);
    });
  }
  return new Promise(resolve => {
    ytScriptLoaded = true;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    window.onYouTubeIframeAPIReady = resolve;
    document.head.appendChild(tag);
  });
}

/* ============================================================
   ইন্ডিকেটর
============================================================ */
let bgIndicatorTimer = null;
function showBgIndicator(mode, text) {
  const el = document.getElementById('bgIndicator');
  const icon = document.getElementById('bgIcon');
  const txt = document.getElementById('bgText');
  el.classList.remove('fg');
  if (mode === 'foreground') {
    el.classList.add('fg');
    icon.textContent = '⚠️';
  } else {
    icon.textContent = '🔊';
  }
  txt.textContent = text;
  el.classList.add('show');
  clearTimeout(bgIndicatorTimer);
  bgIndicatorTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ============================================================
   কন্ট্রোল
============================================================ */
function togglePlay() {
  const t = queue[currentIndex];
  if (!t) { if (queue.length) playAt(0); return; }

  if (currentPlayMode === 'yt-iframe' && ytPlayer && ytReady) {
    try {
      const state = ytPlayer.getPlayerState();
      if (state === 1) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    } catch(e) {}
  } else {
    if (audio.paused) audio.play(); else audio.pause();
  }
}

function playNext() { if (queue.length) playAt((currentIndex + 1) % queue.length); }
function playPrev() {
  if (!queue.length) return;
  if ((currentPlayMode === 'audius' || currentPlayMode === 'yt-audio') && audio.currentTime > 3) {
    audio.currentTime = 0; return;
  }
  playAt((currentIndex - 1 + queue.length) % queue.length);
}

function highlightCurrent() {
  document.querySelectorAll('.track-row').forEach(el => el.classList.remove('playing'));
  const el = document.querySelector(`.track-row[data-index="${currentIndex}"]`);
  if (el) el.classList.add('playing');
}

/* ============================================================
   Media Session
============================================================ */
function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title || 'অজানা',
      artist: track.artist || 'অজানা শিল্পী',
      artwork: [{ src: track.artwork || PLACEHOLDER, sizes: '480x480', type: 'image/jpeg' }]
    });
    const h = {
      play: () => togglePlay(),
      pause: () => togglePlay(),
      previoustrack: () => playPrev(),
      nexttrack: () => playNext()
    };
    for (const [a, fn] of Object.entries(h)) {
      try { navigator.mediaSession.setActionHandler(a, fn); } catch(e) {}
    }
  } catch(e) {}
}

/* ============================================================
   অডিও ইভেন্ট
============================================================ */
audio.addEventListener('play', () => setPlayIcon(true));
audio.addEventListener('pause', () => {
  if (currentPlayMode === 'audius' || currentPlayMode === 'yt-audio') setPlayIcon(false);
});
audio.addEventListener('ended', () => {
  if (currentPlayMode === 'audius' || currentPlayMode === 'yt-audio') playNext();
});
audio.addEventListener('error', (e) => {
  console.warn('Audio error:', e);
  if (currentPlayMode === 'yt-audio') {
    const t = queue[currentIndex];
    if (t && t.source === 'youtube') {
      console.log('Audio stream failed → iframe fallback');
      playYouTubeIframe(t);
    }
  }
});

audio.addEventListener('timeupdate', () => {
  if (currentPlayMode !== 'audius' && currentPlayMode !== 'yt-audio') return;
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  document.getElementById('curTime').textContent = fmtTime(cur);
  document.getElementById('durTime').textContent = dur ? fmtTime(dur) : '0:00';
  document.getElementById('progressFill').style.width = (dur ? (cur/dur)*100 : 0) + '%';
  if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && dur > 0) {
    try {
      navigator.mediaSession.setPositionState({ duration: dur, playbackRate: 1, position: Math.min(cur, dur) });
    } catch(e) {}
  }
});

setInterval(() => {
  if (currentPlayMode !== 'yt-iframe' || !ytPlayer || !ytReady) return;
  try {
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    document.getElementById('curTime').textContent = fmtTime(cur);
    document.getElementById('durTime').textContent = dur ? fmtTime(dur) : '0:00';
    document.getElementById('progressFill').style.width = (dur ? (cur/dur)*100 : 0) + '%';
  } catch(e) {}
}, 1000);

function setPlayIcon(playing) {
  document.getElementById('playIcon').innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function seek(e) {
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (currentPlayMode === 'yt-iframe' && ytPlayer && ytReady) {
    try {
      const dur = ytPlayer.getDuration() || 0;
      if (dur) ytPlayer.seekTo(pct * dur, true);
    } catch(e) {}
  } else if (audio.duration) {
    audio.currentTime = pct * audio.duration;
  }
}

function setVolume(e) {
  const rect = document.getElementById('volumeBar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = pct;
  if (ytPlayer && ytReady) { try { ytPlayer.setVolume(pct * 100); } catch(e){} }
  lastVolume = pct; isMuted = false;
  document.getElementById('volumeFill').style.width = (pct * 100) + '%';
}

function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) {
    lastVolume = audio.volume;
    audio.volume = 0;
    if (ytPlayer && ytReady) { try { ytPlayer.setVolume(0); } catch(e){} }
    document.getElementById('volumeFill').style.width = '0%';
  } else {
    audio.volume = lastVolume || 0.8;
    if (ytPlayer && ytReady) { try { ytPlayer.setVolume((lastVolume || 0.8) * 100); } catch(e){} }
    document.getElementById('volumeFill').style.width = ((lastVolume || 0.8) * 100) + '%';
  }
}

/* ============================================================
   UI হেল্পার
============================================================ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function focusSearch() { document.getElementById('searchInput').focus(); closeSidebar(); }
function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
function fmtTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight' && e.shiftKey) playNext();
  if (e.code === 'ArrowLeft' && e.shiftKey) playPrev();
});

/* শুরু */
loadTrending();
</script>
