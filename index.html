<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Amar Music</title>
<link rel="manifest" id="manifestLink">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0a;
    --panel: #121212;
    --panel-2: #181818;
    --hover: #1f1f1f;
    --accent: #1db954;
    --text: #ffffff;
    --text-dim: #a7a7a7;
    --border: #282828;
    --player-h: 88px;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr var(--player-h);
    grid-template-areas:
      "sidebar main"
      "player player";
  }

  /* ===== Sidebar ===== */
  .sidebar {
    grid-area: sidebar;
    background: var(--panel);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding-top: max(1.5rem, env(safe-area-inset-top));
  }
  .logo {
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 1.4rem; font-weight: 700;
    padding: 0 0.5rem 1.5rem;
    color: var(--text);
  }
  .logo .dot {
    width: 28px; height: 28px;
    background: var(--accent); border-radius: 50%;
    display: grid; place-items: center; font-size: 1rem;
  }
  .nav-item {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.7rem 0.8rem; border-radius: 6px;
    color: var(--text-dim); cursor: pointer;
    font-size: 0.95rem; font-weight: 600;
    transition: all 0.15s; user-select: none;
  }
  .nav-item:hover, .nav-item.active { color: var(--text); background: var(--hover); }
  .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
  .sidebar hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0.5rem; }
  .sidebar-title {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim);
    padding: 0 0.8rem 0.5rem; font-weight: 700;
  }

  /* ===== Main ===== */
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 1.5rem 2rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    background: linear-gradient(180deg, #1a1a1a 0%, var(--bg) 300px);
    -webkit-overflow-scrolling: touch;
  }
  .main::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 10px; }
  .main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb {
    background: #333; border-radius: 5px;
  }

  .topbar {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 2rem;
    position: sticky; top: -1.5rem;
    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 1rem 0; margin-top: -1rem; z-index: 10;
  }
  .search-box { flex: 1; max-width: 400px; position: relative; }
  .search-box input {
    width: 100%;
    padding: 0.7rem 1rem 0.7rem 2.5rem;
    border-radius: 500px;
    border: 1px solid transparent;
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.9rem; outline: none;
    transition: all 0.2s;
  }
  .search-box input:focus { border-color: var(--text); background: #242424; }
  .search-box svg {
    position: absolute; left: 0.8rem; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-dim);
  }

  .section-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.2rem; }

  .track-list { display: flex; flex-direction: column; }
  .track-row {
    display: grid;
    grid-template-columns: 30px 44px 1fr 1fr 60px;
    gap: 1rem; align-items: center;
    padding: 0.6rem 0.8rem;
    border-radius: 6px; cursor: pointer;
    transition: background 0.15s;
  }
  .track-row:hover { background: var(--hover); }
  .track-row.playing { background: #1a2e1f; }
  .track-row.playing .track-title { color: var(--accent); }
  .track-num { color: var(--text-dim); font-size: 0.9rem; text-align: center; }
  .track-row .play-icon { display: none; }
  .track-row:hover .track-num { display: none; }
  .track-row:hover .play-icon { display: block; }
  .track-art {
    width: 44px; height: 44px; border-radius: 4px;
    background: #333; object-fit: cover;
  }
  .track-info { min-width: 0; }
  .track-title {
    font-size: 0.95rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 0.8rem; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-duration { color: var(--text-dim); font-size: 0.85rem; text-align: right; }
  .empty, .loading { text-align: center; color: var(--text-dim); padding: 3rem 1rem; font-size: 0.95rem; }

  /* ===== Player ===== */
  .player {
    grid-area: player;
    background: var(--panel-2);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    padding: 0 1rem;
    padding-bottom: env(safe-area-inset-bottom);
    gap: 1rem;
  }
  .now-playing { display: flex; align-items: center; gap: 0.8rem; min-width: 0; }
  .now-playing img {
    width: 56px; height: 56px; border-radius: 4px;
    background: #333; object-fit: cover;
  }
  .now-playing .np-info { min-width: 0; }
  .now-playing .np-title {
    font-size: 0.9rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now-playing .np-artist {
    font-size: 0.75rem; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player-center {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.4rem;
  }
  .controls { display: flex; align-items: center; gap: 1rem; }
  .ctrl-btn {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    padding: 0.4rem; display: grid; place-items: center;
    transition: color 0.15s;
  }
  .ctrl-btn:hover { color: var(--text); }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--text); color: #000;
    display: grid; place-items: center; cursor: pointer;
    border: none; transition: transform 0.15s;
  }
  .play-btn:hover { transform: scale(1.08); }
  .play-btn svg { width: 16px; height: 16px; }
  .progress-row {
    display: flex; align-items: center; gap: 0.7rem;
    width: 100%; max-width: 600px;
  }
  .time { font-size: 0.7rem; color: var(--text-dim); min-width: 35px; text-align: center; }
  .progress-bar, .volume-bar {
    flex: 1; height: 4px; background: #4d4d4d;
    border-radius: 2px; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .progress-fill, .volume-fill {
    height: 100%; background: var(--text); width: 0%;
    border-radius: 2px; transition: width 0.1s linear;
  }
  .progress-bar:hover .progress-fill,
  .volume-bar:hover .volume-fill { background: var(--accent); }
  .player-right {
    display: flex; align-items: center;
    justify-content: flex-end; gap: 0.8rem;
  }
  .volume-bar { width: 100px; flex: none; }
  .hamburger {
    display: none; background: none; border: none;
    color: var(--text); cursor: pointer; padding: 0.4rem;
  }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 99;
  }
  .overlay.show { display: block; }

  /* ===== Mobile ===== */
  @media (max-width: 768px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas: "main" "player";
    }
    .sidebar {
      position: fixed; top: 0; left: -260px;
      width: 240px; height: 100dvh; z-index: 100;
      transition: left 0.3s cubic-bezier(0.4,0,0.2,1);
      padding-top: max(1.5rem, env(safe-area-inset-top));
    }
    .sidebar.open { left: 0; }
    .hamburger { display: block; }
    .main { padding: 1rem; padding-top: max(0.75rem, env(safe-area-inset-top)); }
    .topbar { top: -0.75rem; margin-top: -0.75rem; padding: 0.75rem 0; }
    .section-title { font-size: 1.3rem; }
    .track-row {
      grid-template-columns: 30px 44px 1fr 50px;
      gap: 0.75rem; padding: 0.5rem;
    }
    .track-row .track-album { display: none; }
    .track-art { width: 40px; height: 40px; }

    /* মোবাইল প্লেয়ার — তিন সারিতে */
    .player {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      grid-template-areas:
        "now controls"
        "progress progress";
      padding: 0.6rem 0.75rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      gap: 0.5rem;
      --player-h: auto;
    }
    .now-playing { grid-area: now; }
    .now-playing img { width: 42px; height: 42px; }
    .now-playing .np-title { font-size: 0.85rem; }
    .now-playing .np-artist { font-size: 0.7rem; }
    .player-center { grid-area: controls; display: block; }
    .controls { gap: 0.6rem; }
    .ctrl-btn { padding: 0.35rem; }
    .ctrl-btn svg { width: 22px; height: 22px; }
    .play-btn { width: 40px; height: 40px; }
    .play-btn svg { width: 18px; height: 18px; }
    .player-right { display: none; }
    .progress-row {
      grid-area: progress; max-width: none; gap: 0.5rem;
    }
    .time { font-size: 0.65rem; min-width: 30px; }
  }

  @media (max-width: 380px) {
    .track-row { grid-template-columns: 24px 40px 1fr 45px; gap: 0.5rem; }
    .track-num { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="dot">♪</div>
    Amar Music
  </div>

  <div class="nav-item active" onclick="loadTrending(); setActive(this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    ট্রেন্ডিং
  </div>
  <div class="nav-item" onclick="loadFeatured(); setActive(this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
    ফিচার্ড
  </div>
  <div class="nav-item" onclick="focusSearch(); setActive(this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    সার্চ
  </div>

  <hr>
  <div class="sidebar-title">তোমার লাইব্রেরি</div>
  <div class="nav-item" onclick="showQueue(); setActive(this); closeSidebar();">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-5v8.5a2.5 2.5 0 1 1-2-2.45V9h5V7h-5v4z"/></svg>
    প্লে-কিউ
  </div>
</aside>

<main class="main" id="main">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="গান, শিল্পী বা অ্যালবাম..." onkeydown="if(event.key==='Enter'){doSearch(); this.blur();}">
    </div>
  </div>

  <h2 class="section-title" id="sectionTitle">ট্রেন্ডিং গান</h2>
  <div id="content">
    <div class="loading">লোড হচ্ছে...</div>
  </div>
</main>

<div class="player">
  <div class="now-playing" onclick="openFullPlayer()">
    <img id="npArt" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><rect width='56' height='56' fill='%23333'/><text x='28' y='36' font-size='24' text-anchor='middle' fill='%23666'>♪</text></svg>" alt="">
    <div class="np-info">
      <div class="np-title" id="npTitle">কিছু প্লে হয়নি</div>
      <div class="np-artist" id="npArtist">একটা গান বেছে নাও</div>
    </div>
  </div>

  <div class="player-center">
    <div class="controls">
      <button class="ctrl-btn" onclick="playPrev()" aria-label="আগের">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="প্লে/পজ">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="playNext()" aria-label="পরের">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>
    <div class="progress-row">
      <span class="time" id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar" onclick="seek(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time" id="durTime">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" aria-label="মিউট">
      <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <div class="volume-bar" id="volumeBar" onclick="setVolume(event)">
      <div class="volume-fill" id="volumeFill" style="width:80%"></div>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline crossorigin="anonymous"></audio>

<script>
/* ============================================================
   কনফিগারেশন
============================================================ */
const APP_NAME = 'AmarMusicApp';
const API_KEY  = '2e086e9c9bd876da89c992a57effb89d196234e2';
const API_BASE = 'https://discoveryprovider.audius.co/v1';
const HEADERS  = { 'x-api-key': API_KEY };

let queue = [];
let currentIndex = -1;
let isMuted = false;
let lastVolume = 0.8;

const audio = document.getElementById('audio');
audio.volume = lastVolume;

/* ============================================================
   PWA — ফোনে ইনস্টলযোগ্য করতে (ব্রাউজার সাপোর্ট করলে)
   এটা ইনস্টল হলে ব্যাকগ্রাউন্ড প্লেব্যাক আরও ভালো কাজ করে
============================================================ */
const manifestData = {
  name: 'Amar Music',
  short_name: 'Amar Music',
  start_url: '.',
  display: 'standalone',
  background_color: '#0a0a0a',
  theme_color: '#1db954',
  orientation: 'portrait',
  icons: [{
    src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" fill="%230a0a0a"/><circle cx="256" cy="256" r="180" fill="%231db954"/><text x="256" y="330" font-size="220" text-anchor="middle" fill="white">♪</text></svg>',
    sizes: '512x512',
    type: 'image/svg+xml',
    purpose: 'any maskable'
  }]
};
try {
  const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
  document.getElementById('manifestLink').href = URL.createObjectURL(blob);
} catch (e) { /* কিছু পুরনো ব্রাউজারে কাজ নাও করতে পারে */ }

/* ============================================================
   API
============================================================ */
async function apiGet(path) {
  const url = `${API_BASE}${path}${path.includes('?') ? '&' : '?'}app_name=${APP_NAME}`;
  const res = await fetch(url, { headers: HEADERS });
  if (!res.ok) throw new Error('API ' + res.status);
  return res.json();
}

async function loadTrending() {
  setTitle('ট্রেন্ডিং গান');
  setContent('<div class="loading">লোড হচ্ছে...</div>');
  try {
    const data = await apiGet('/tracks/trending?limit=30');
    renderTracks(data.data || []);
  } catch (e) {
    setContent('<div class="empty">গান লোড করা যায়নি। ইন্টারনেট চেক করো।</div>');
    console.error(e);
  }
}

async function loadFeatured() {
  setTitle('ফিচার্ড প্লেলিস্ট');
  setContent('<div class="loading">লোড হচ্ছে...</div>');
  try {
    const data = await apiGet('/playlists/trending?limit=10');
    const tracks = [];
    (data.data || []).forEach(pl => (pl.tracks || []).slice(0, 3).forEach(t => tracks.push(t)));
    if (tracks.length === 0) {
      const fb = await apiGet('/tracks/trending?limit=30');
      renderTracks(fb.data || []);
    } else renderTracks(tracks);
  } catch (e) { loadTrending(); }
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  setTitle(`"${q}" এর ফলাফল`);
  setContent('<div class="loading">খোঁজা হচ্ছে...</div>');
  try {
    const data = await apiGet(`/tracks/search?query=${encodeURIComponent(q)}&limit=30`);
    renderTracks(data.data || []);
  } catch (e) {
    setContent('<div class="empty">সার্চে সমস্যা হয়েছে।</div>');
  }
}

/* ============================================================
   রেন্ডার
============================================================ */
function setTitle(t) { document.getElementById('sectionTitle').textContent = t; }
function setContent(html) { document.getElementById('content').innerHTML = html; }

function renderTracks(tracks) {
  if (!tracks.length) { setContent('<div class="empty">কোনো গান পাওয়া যায়নি।</div>'); return; }
  queue = tracks;
  setContent(`<div class="track-list">` + tracks.map((t, i) => {
    const art = t.artwork ? t.artwork['150x150'] : placeholderArt();
    const artist = t.user ? t.user.name : 'অজানা শিল্পী';
    const dur = t.duration ? fmtTime(t.duration) : '—';
    return `
      <div class="track-row" data-index="${i}" onclick="playAt(${i})">
        <div class="track-num">
          <span>${i + 1}</span>
          <svg class="play-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <img class="track-art" src="${art}" alt="" onerror="this.src='${placeholderArt()}'">
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(artist)}</div>
        </div>
        <div class="track-album track-artist">${escapeHtml(t.genre || '')}</div>
        <div class="track-duration">${dur}</div>
      </div>`;
  }).join('') + `</div>`);
  highlightCurrent();
}

function showQueue() {
  setTitle('প্লে-কিউ');
  if (!queue.length) { setContent('<div class="empty">কিউ খালি।</div>'); return; }
  renderTracks(queue);
}

/* ============================================================
   প্লেব্যাক + Media Session (ব্যাকগ্রাউন্ড প্লেব্যাকের মূল চাবি)
============================================================ */
function playAt(index) {
  if (index < 0 || index >= queue.length) return;
  currentIndex = index;
  const t = queue[index];

  const art = t.artwork ? (t.artwork['480x480'] || t.artwork['150x150']) : placeholderArt();
  document.getElementById('npArt').src = art;
  document.getElementById('npTitle').textContent = t.title;
  document.getElementById('npArtist').textContent = t.user ? t.user.name : '';

  audio.src = `${API_BASE}/tracks/${t.id}/stream?app_name=${APP_NAME}`;
  audio.play().catch(err => console.warn('Play error:', err));

  // 🔑 Media Session — এই অংশটাই ব্যাকগ্রাউন্ড প্লেব্যাক চালু করে
  updateMediaSession(t, art);
  highlightCurrent();
}

function updateMediaSession(track, artworkUrl) {
  if (!('mediaSession' in navigator)) return;

  // নোটিফিকেশন/লক স্ক্রিনে যে তথ্য দেখাবে
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title || 'অজানা',
    artist: (track.user && track.user.name) || 'অজানা শিল্পী',
    album: track.genre || 'Amar Music',
    artwork: [
      { src: artworkUrl, sizes: '150x150', type: 'image/jpeg' },
      { src: artworkUrl, sizes: '480x480', type: 'image/jpeg' },
      { src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }
    ]
  });

  // লক স্ক্রিন / হেডফোন / স্মার্টওয়াচের বাটনগুলো কাজ করবে
  const handlers = {
    play: () => audio.play(),
    pause: () => audio.pause(),
    previoustrack: () => playPrev(),
    nexttrack: () => playNext(),
    seekbackward: (d) => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); },
    seekforward:  (d) => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (d.seekOffset || 10)); },
    seekto: (d) => { if (d.seekTime != null) audio.currentTime = d.seekTime; }
  };
  for (const [action, fn] of Object.entries(handlers)) {
    try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {}
  }
}

function togglePlay() {
  if (!audio.src) { if (queue.length) playAt(0); return; }
  if (audio.paused) audio.play(); else audio.pause();
}
function playNext() { if (queue.length) playAt((currentIndex + 1) % queue.length); }
function playPrev() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playAt((currentIndex - 1 + queue.length) % queue.length);
}

function highlightCurrent() {
  document.querySelectorAll('.track-row').forEach(el => el.classList.remove('playing'));
  const el = document.querySelector(`.track-row[data-index="${currentIndex}"]`);
  if (el) el.classList.add('playing');
}

/* ============================================================
   অডিও ইভেন্ট
============================================================ */
audio.addEventListener('play', () => {
  setPlayIcon(true);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  setPlayIcon(false);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
audio.addEventListener('ended', playNext);

audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime || 0;
  const dur = audio.duration || 0;
  document.getElementById('curTime').textContent = fmtTime(cur);
  document.getElementById('durTime').textContent = dur ? fmtTime(dur) : '0:00';
  document.getElementById('progressFill').style.width = (dur ? (cur / dur) * 100 : 0) + '%';

  // লক স্ক্রিনের প্রোগ্রেস বার আপডেট
  if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && dur > 0) {
    try {
      navigator.mediaSession.setPositionState({
        duration: dur,
        playbackRate: audio.playbackRate,
        position: Math.min(cur, dur)
      });
    } catch (e) {}
  }
});

function setPlayIcon(isPlaying) {
  document.getElementById('playIcon').innerHTML = isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function seek(e) {
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = pct * audio.duration;
}
function setVolume(e) {
  const rect = document.getElementById('volumeBar').getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = pct; lastVolume = pct; isMuted = false;
  document.getElementById('volumeFill').style.width = (pct * 100) + '%';
  updateVolIcon();
}
function toggleMute() {
  isMuted = !isMuted;
  if (isMuted) { lastVolume = audio.volume; audio.volume = 0; document.getElementById('volumeFill').style.width = '0%'; }
  else { audio.volume = lastVolume || 0.8; document.getElementById('volumeFill').style.width = (audio.volume * 100) + '%'; }
  updateVolIcon();
}
function updateVolIcon() {
  const icon = document.getElementById('volIcon');
  if (isMuted || audio.volume === 0)
    icon.innerHTML = '<path d="M3 10v4h4l5 5V5L7 10H3zm18.5 4l-1.4-1.4L17 15.7l-1.4-1.4-1.4 1.4 1.4 1.4-1.4 1.4 1.4 1.4L17 18.5l3.1 3.1 1.4-1.4-3.1-3.1z"/>';
  else
    icon.innerHTML = '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>';
}

/* ============================================================
   মোবাইল সাইডবার

  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');

  document.getElementById('searchInput').focus();
  closeSidebar();
}

/* ============================================================
   হেল্পার
============================================================ */
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function placeholderArt() {
  return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><rect width='150' height='150' fill='%23282828'/><text x='75' y='85' font-size='48' text-anchor='middle' fill='%23666'>♪</text></svg>";
}
function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}

/* কীবোর্ড শর্টকাট (ডেস্কটপ) */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight' && e.shiftKey) playNext();
  if (e.code === 'ArrowLeft' && e.shiftKey) playPrev();
});

loadTrending();
